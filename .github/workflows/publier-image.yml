# T17 : publie l'image d'outils sur le registre GitHub, en arm64 et amd64, à chaque étiquette de
# version (git tag v0.1.0 && git push origin v0.1.0). Ne se déclenche jamais tout seul.
name: Publier l'image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom de l'image en minuscules
        id: nom
        env:
          PROPRIETAIRE: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${PROPRIETAIRE,,}/guadan-outils" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:${{ github.ref_name }}
            ${{ steps.nom.outputs.image }}:latest
      - name: Vérifier l'image publiée (amd64)
        run: bash docker/verifier_image.sh "${{ steps.nom.outputs.image }}:${{ github.ref_name }}"
