# Étape 3 (T15) : guadan sur le jeu de bugs figé eval/jeu.json, versions boguée et corrigée,
# sans LLM (mesure reproductible et sans clé). Résultat : eval/resultats.md en artefact.
name: Évaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jeu:
    runs-on: ubuntu-latest
    outputs:
      cas: ${{ steps.lire.outputs.cas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lire
        run: echo "cas=$(python3 -c 'import json; print(json.dumps(json.load(open("eval/jeu.json"))))')" >> "$GITHUB_OUTPUT"

  cas:
    needs: jeu
    name: ${{ matrix.cas.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cas: ${{ fromJSON(needs.jeu.outputs.cas) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Suresoft-GLaDOS/bugscpp
          ref: be5cc489cb2b3127ec3b73cb4adfdd290807f55b
          path: bugscpp-src
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - run: pip install -r bugscpp-src/requirements.txt
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: docker build -q -t guadan-outils docker/
      - name: guadan sur les versions boguée et corrigée
        env:
          P: ${{ matrix.cas.projet }}
          I: ${{ matrix.cas.index }}
          ID: ${{ matrix.cas.id }}
          APT: ${{ join(matrix.cas.apt, ' ') }}
        run: |
          set -u
          mkdir -p "res/$ID"
          cp "bugscpp-src/bugscpp/taxonomy/$P/patch/$(printf %04d "$I")-buggy.patch" "res/$ID/bug.patch"
          opts=""; for a in $APT; do opts="$opts --apt $a"; done
          for v in buggy fixed; do
            flag=""; [ "$v" = buggy ] && flag="--buggy"
            python bugscpp-src/bugscpp/bugscpp.py checkout "$P" "$I" $flag
            python -m guadan analyse "$P/$v-$I" --sortie "res/$ID/$v" --sans-llm --fuzz-duree 0 $opts
            echo "$v : code de sortie $?"
            rm -rf "res/$ID/$v/travail"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: res-${{ matrix.cas.id }}
          path: res/

  agreger:
    needs: cas
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: res-*
          merge-multiple: true
          path: res
      - run: python3 -m eval.agreger res | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation
          path: res/
