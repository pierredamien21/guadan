name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Tests rapides (sans Docker)
        run: python -m pytest -q -m "not docker"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire l'image d'outils (amd64)
        run: docker build -t guadan-outils docker/
      - name: Vérifier ASan, UBSan et libFuzzer dans l'image
        run: bash docker/verifier_image.sh guadan-outils

  bout-en-bout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Construire l'image d'outils (amd64)
        run: docker build -t guadan-outils docker/
      - name: Tests avec Docker (bac à sable, build, tests, analyse, bout en bout)
        run: python -m pytest -q -m docker
