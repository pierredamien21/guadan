# Essaie l'action guadan (action.yml) telle qu'un utilisateur l'emploierait.
name: Essai de l'action

on:
  push:
    branches: [main]
    paths: [action.yml, guadan/**, docker/**, .github/workflows/essai-action.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: bogue
        uses: ./
        with:
          chemin: exemples/debordement-tas
          nom-rapport: rapport-debordement
          echouer-si-prouve: "false"
      - id: sain
        uses: ./
        with:
          chemin: exemples/sain
          nom-rapport: rapport-sain
      - name: Vérifier les sorties
        env:
          BOGUE: ${{ steps.bogue.outputs.prouves }}
          SAIN: ${{ steps.sain.outputs.prouves }}
        run: |
          echo "debordement-tas : $BOGUE prouvé(s) ; sain : $SAIN"
          [ "$BOGUE" = 1 ] && [ "$SAIN" = 0 ]
